# Kuboard v4 集群内部署（服务端 + 内置 MariaDB）
# 适配：k8s-prod-ha 3 节点控制平面集群，无 StorageClass，数据落 master-01 hostPath
# 访问：http://192.168.1.100:30080  初始账号 admin / Kuboard123
---
apiVersion: v1
kind: Namespace
metadata:
  name: kuboard
  labels:
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kuboard-db-init
  namespace: kuboard
data:
  create_db.sql: |
    CREATE DATABASE kuboard DEFAULT CHARACTER SET = 'utf8mb4' DEFAULT COLLATE = 'utf8mb4_unicode_ci';
    create user 'kuboard'@'%' identified by 'kuboardpwd';
    grant all privileges on kuboard.* to 'kuboard'@'%';
    FLUSH PRIVILEGES;
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: kuboard-mariadb-pv
spec:
  capacity:
    storage: 5Gi
  accessModes: ["ReadWriteOnce"]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: kuboard-local
  hostPath:
    path: /data/kuboard-mariadb
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: ["k8s-master-01"]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kuboard-mariadb-data
  namespace: kuboard
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: kuboard-local
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuboard-db
  namespace: kuboard
  labels:
    app: kuboard-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kuboard-db
  template:
    metadata:
      labels:
        app: kuboard-db
    spec:
      nodeSelector:
        kubernetes.io/hostname: k8s-master-01
      containers:
        - name: mariadb
          image: swr.cn-east-2.myhuaweicloud.com/kuboard/mariadb:11.3.2-jammy
          env:
            - name: MARIADB_ROOT_PASSWORD
              value: "kuboardpwd"
            - name: TZ
              value: "Asia/Shanghai"
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          # mariadb 11.3 镜像无 mysqladmin，改用 tcp 探针
          startupProbe:
            tcpSocket:
              port: 3306
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            tcpSocket:
              port: 3306
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kuboard-mariadb-data
        - name: init
          configMap:
            name: kuboard-db-init
---
apiVersion: v1
kind: Service
metadata:
  name: kuboard-db
  namespace: kuboard
  labels:
    app: kuboard-db
spec:
  selector:
    app: kuboard-db
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuboard
  namespace: kuboard
  labels:
    app: kuboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kuboard
  template:
    metadata:
      labels:
        app: kuboard
    spec:
      containers:
        - name: kuboard
          image: swr.cn-east-2.myhuaweicloud.com/kuboard/kuboard:v4
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: DB_DRIVER
              value: "org.mariadb.jdbc.Driver"
            - name: DB_URL
              value: "jdbc:mariadb://kuboard-db.kuboard.svc.ai4system.com:3306/kuboard?serverTimezone=Asia/Shanghai"
# 注意：本集群 kubeadm clusterDomain 为 ai4system.com，不能用默认 cluster.local
            - name: DB_USERNAME
              value: "kuboard"
            - name: DB_PASSWORD
              value: "kuboardpwd"
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
            failureThreshold: 30
---
apiVersion: v1
kind: Service
metadata:
  name: kuboard
  namespace: kuboard
  labels:
    app: kuboard
spec:
  type: NodePort
  selector:
    app: kuboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
